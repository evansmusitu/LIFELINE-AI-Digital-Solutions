<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // HTTPS only on the live address. The domain doesn't redirect plain HTTP for these pages, and the
      // chat's requests over HTTP would fail (worker/http.ts redirects the Worker's own paths).
      if (location.protocol === 'http:' && location.host === new URL('%SITE_URL%').host) {
        location.replace('https:' + location.href.slice(5))
      }
    </script>
    <!--
      The build (vite.config.ts) puts the page title, description, link-preview text and canonical link
      at the marker below, and fills in the site address from SITE.url in src/config/site.ts. Each demo
      page gets its own copy of this file with that demo's title and summary.
    -->
    <!-- page-meta -->
    <!-- page-jsonld -->
    <meta name="theme-color" content="#050B1F" />
    <!-- Link previews (WhatsApp, Facebook, LinkedIn, X). Crawlers need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LIFELINE AI CONCIERGE" />
    <!-- Raise ?v= whenever og-image.jpg changes: Facebook and others keep the old image for the same address. -->
    <meta property="og:image" content="%SITE_URL%/og-image.jpg?v=2" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Tari, the LIFELINE AI CONCIERGE AI receptionist, live on a video call, with the words: Talk to our AI receptionist. Live, face to face."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/src/assets/logo-mark.png" />
    <style>
      /* Paint the brand background before CSS and JavaScript arrive on slow connections. */
      html { background: #050b1f; color: #dce3f2; }
    </style>
  </head>
  <body>
    <!-- The build (vite.config.ts) puts the page's own content here, readable without JavaScript. The app replaces it when it starts. -->
    <div id="root"><!-- page-body --></div>
    <noscript>
      <p style="padding: 24px; text-align: center">
        The Demo Studio needs JavaScript to run the interactive demos.
        You can still reach us on WhatsApp:
        <a href="https://wa.me/263781572008" style="color: #00d4ff">+263 781 572 008</a>
        or by email:
        <a href="mailto:support@mftintelligence.com" style="color: #00d4ff">support@mftintelligence.com</a>
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
