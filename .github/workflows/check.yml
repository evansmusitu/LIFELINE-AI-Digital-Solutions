# Runs on every pull request and every merge into main: a clean install, the code-quality
# check (oxlint), the logic tests (Vitest), the production build (which includes the TypeScript type check)
# and a dry run of the Worker deploy.
# Cloudflare Workers Builds deploys the site separately. This check only reports pass or fail.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same pull request cancels the run that is still going.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The AI receptionist's Worker: types match wrangler.jsonc, and the script bundles. Neither needs a Cloudflare login.
      - run: npx wrangler types worker/worker-configuration.d.ts --strict-vars=false --check
      - run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
